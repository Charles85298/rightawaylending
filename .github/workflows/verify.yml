name: Verify website candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Save the public website for review
        uses: actions/upload-artifact@v4
        with:
          name: right-away-public-candidate
          path: dist/
          include-hidden-files: false
          retention-days: 14
